<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
<defs>
<style>
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px #ffd700)}50%{filter:drop-shadow(0 0 12px #fff)}}
@keyframes shift{0%{fill:#ffd700}25%{fill:#ff6f00}50%{fill:#fff}75%{fill:#ffd700}100%{fill:#ffd700}}
@keyframes slide{0%{transform:translateX(-20px);opacity:0}50%{opacity:1}100%{transform:translateX(20px);opacity:0}}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</defs>
<rect width="120" height="120" rx="14" fill="#0a0a1a"/>
<g style="animation:slide 2s ease-in-out infinite"><circle cx="60" cy="45" r="6" fill="#ffd700"/><ellipse cx="45" cy="42" rx="20" ry="3" fill="#ff6f00" opacity="0.5"/></g>
<text x="60" y="76" text-anchor="middle" fill="#ffd700" font-family="sans-serif" font-size="10" font-weight="900">Comet</text>
</svg>