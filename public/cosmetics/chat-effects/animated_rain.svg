<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
<defs>
<style>
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px #90caf9)}50%{filter:drop-shadow(0 0 12px #0d47a1)}}
@keyframes shift{0%{fill:#90caf9}25%{fill:#2196f3}50%{fill:#0d47a1}75%{fill:#90caf9}100%{fill:#90caf9}}
@keyframes slide{0%{transform:translateX(-20px);opacity:0}50%{opacity:1}100%{transform:translateX(20px);opacity:0}}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</defs>
<rect width="120" height="120" rx="14" fill="#0d47a1"/>
<line x1="10" y1="20" x2="5" y2="50" stroke="#90caf9" stroke-width="1.5" opacity="0.6" style="animation:slide 0.8s ease-in-out infinite;animation-delay:0s"/>
<line x1="24" y1="20" x2="19" y2="50" stroke="#2196f3" stroke-width="1.5" opacity="0.6" style="animation:slide 0.9s ease-in-out infinite;animation-delay:0.06s"/>
<line x1="38" y1="20" x2="33" y2="50" stroke="#90caf9" stroke-width="1.5" opacity="0.6" style="animation:slide 1s ease-in-out infinite;animation-delay:0.12s"/>
<line x1="52" y1="20" x2="47" y2="50" stroke="#2196f3" stroke-width="1.5" opacity="0.6" style="animation:slide 1.1s ease-in-out infinite;animation-delay:0.18s"/>
<line x1="66" y1="20" x2="61" y2="50" stroke="#90caf9" stroke-width="1.5" opacity="0.6" style="animation:slide 1.2000000000000002s ease-in-out infinite;animation-delay:0.24s"/>
<line x1="80" y1="20" x2="75" y2="50" stroke="#2196f3" stroke-width="1.5" opacity="0.6" style="animation:slide 1.3s ease-in-out infinite;animation-delay:0.3s"/>
<line x1="94" y1="20" x2="89" y2="50" stroke="#90caf9" stroke-width="1.5" opacity="0.6" style="animation:slide 1.4000000000000001s ease-in-out infinite;animation-delay:0.36s"/>
<line x1="108" y1="20" x2="103" y2="50" stroke="#2196f3" stroke-width="1.5" opacity="0.6" style="animation:slide 1.5s ease-in-out infinite;animation-delay:0.42s"/>
<text x="60" y="76" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="900">Rain</text>
</svg>