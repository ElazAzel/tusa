<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
<defs>
<style>
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px #80deea)}50%{filter:drop-shadow(0 0 12px #c9ff05)}}
@keyframes shift{0%{fill:#80deea}25%{fill:#4dd0e1}50%{fill:#c9ff05}75%{fill:#80deea}100%{fill:#80deea}}
@keyframes slide{0%{transform:translateX(-20px);opacity:0}50%{opacity:1}100%{transform:translateX(20px);opacity:0}}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</defs>
<rect width="120" height="120" rx="14" fill="#0d47a1"/>
<circle cx="20" cy="50" r="6" fill="none" stroke="#80deea" stroke-width="2" opacity="0.6" style="animation:pulse 2s ease-in-out infinite;animation-delay:0s"/>
<circle cx="42" cy="50" r="8" fill="none" stroke="#4dd0e1" stroke-width="2" opacity="0.6" style="animation:pulse 2.3s ease-in-out infinite;animation-delay:0.2s"/>
<circle cx="64" cy="50" r="10" fill="none" stroke="#c9ff05" stroke-width="2" opacity="0.6" style="animation:pulse 2.6s ease-in-out infinite;animation-delay:0.4s"/>
<circle cx="86" cy="50" r="12" fill="none" stroke="#80deea" stroke-width="2" opacity="0.6" style="animation:pulse 2.9s ease-in-out infinite;animation-delay:0.6000000000000001s"/>
<circle cx="108" cy="50" r="14" fill="none" stroke="#4dd0e1" stroke-width="2" opacity="0.6" style="animation:pulse 3.2s ease-in-out infinite;animation-delay:0.8s"/>
<text x="60" y="78" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="900">Bubbles</text>
</svg>