<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
<defs>
<style>
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px #1a1a2e)}50%{filter:drop-shadow(0 0 12px #ffd700)}}
@keyframes shift{0%{fill:#1a1a2e}25%{fill:#c9ff05}50%{fill:#ffd700}75%{fill:#1a1a2e}100%{fill:#1a1a2e}}
@keyframes slide{0%{transform:translateX(-20px);opacity:0}50%{opacity:1}100%{transform:translateX(20px);opacity:0}}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</defs>
<rect width="120" height="120" rx="14" fill="#1a1a2e"/>
<circle cx="15" cy="35" r="2.5" fill="#c9ff05" style="animation:pulse 1s ease-in-out infinite;animation-delay:0s"/>
<circle cx="33" cy="47" r="2.5" fill="#ffd700" style="animation:pulse 1.3s ease-in-out infinite;animation-delay:0.15s"/>
<circle cx="51" cy="59" r="2.5" fill="#c9ff05" style="animation:pulse 1.6s ease-in-out infinite;animation-delay:0.3s"/>
<circle cx="69" cy="35" r="2.5" fill="#ffd700" style="animation:pulse 1.9s ease-in-out infinite;animation-delay:0.44999999999999996s"/>
<circle cx="87" cy="47" r="2.5" fill="#c9ff05" style="animation:pulse 2.2s ease-in-out infinite;animation-delay:0.6s"/>
<circle cx="105" cy="59" r="2.5" fill="#ffd700" style="animation:pulse 2.5s ease-in-out infinite;animation-delay:0.75s"/>
<text x="60" y="76" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="900">Fireflies</text>
</svg>