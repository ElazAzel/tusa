<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
<defs>
<style>
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px #ff6b6b)}50%{filter:drop-shadow(0 0 12px #9b59b6)}}
@keyframes shift{0%{fill:#ff6b6b}25%{fill:#ffd93d}50%{fill:#6bcb77}75%{fill:#4d96ff}100%{fill:#ff6b6b}}
@keyframes slide{0%{transform:translateX(-20px);opacity:0}50%{opacity:1}100%{transform:translateX(20px);opacity:0}}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</defs>
<defs><linearGradient id="ganimated_gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff6b6b"/><stop offset="25%" stop-color="#ffd93d"/><stop offset="50%" stop-color="#6bcb77"/><stop offset="75%" stop-color="#4d96ff"/><stop offset="100%" stop-color="#9b59b6"/><animate attributeName="x1" values="0;1;0" dur="4s" repeatCount="indefinite"/></linearGradient></defs>
<rect width="120" height="120" rx="14" fill="url(#ganimated_gradient)"/>
<text x="60" y="65" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="900">Gradient</text>
</svg>