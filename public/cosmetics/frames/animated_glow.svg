<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
<defs>
<style>
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px #ff1791)}50%{filter:drop-shadow(0 0 12px #c9ff05)}}
@keyframes shift{0%{fill:#ff1791}25%{fill:#ff9800}50%{fill:#c9ff05}75%{fill:#ff1791}100%{fill:#ff1791}}
@keyframes slide{0%{transform:translateX(-20px);opacity:0}50%{opacity:1}100%{transform:translateX(20px);opacity:0}}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</defs>
<rect width="120" height="120" rx="14" fill="#1a1a2e"/>
<circle cx="60" cy="50" r="18" fill="#ff1791" style="animation:glow 2s ease-in-out infinite;filter:drop-shadow(0 0 8px #ff1791)"/>
<text x="60" y="76" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="900">Glow</text>
</svg>