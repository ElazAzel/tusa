<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
<defs>
<style>
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px #b0bec5)}50%{filter:drop-shadow(0 0 12px #eceff1)}}
@keyframes shift{0%{fill:#b0bec5}25%{fill:#78909c}50%{fill:#eceff1}75%{fill:#b0bec5}100%{fill:#b0bec5}}
@keyframes slide{0%{transform:translateX(-20px);opacity:0}50%{opacity:1}100%{transform:translateX(20px);opacity:0}}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</defs>
<defs><linearGradient id="chromeGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#b0bec5"/><stop offset="50%" stop-color="#78909c"/><stop offset="100%" stop-color="#eceff1"/><animate attributeName="x1" values="0;1;0" dur="3s" repeatCount="indefinite"/></linearGradient></defs>
<rect width="120" height="120" rx="14" fill="url(#chromeGrad)"/>
<text x="60" y="65" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="900">Chrome</text>
</svg>